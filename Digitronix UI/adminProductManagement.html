<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Product Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">

  <!-- Product Form -->
  <div class="card mb-5">
    <div class="card-header bg-primary text-white">Add / Edit Product</div>
    <div class="card-body">
      <form id="productForm">
        <div class="row mb-3">
          <div class="col-md-6">
            <label for="productName" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="productName" placeholder="Enter product name">
          </div>
          <div class="col-md-3">
            <label for="price" class="form-label">Price ($)</label>
            <input type="number" class="form-control" id="price" placeholder="100.00">
          </div>
          <div class="col-md-3">
            <label for="stock" class="form-label">Stock</label>
            <input type="number" class="form-control" id="stock" placeholder="50">
          </div>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea class="form-control" id="description" rows="3"></textarea>
        </div>

        <div class="row mb-3">
          <div class="col-md-4">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category">
              <option value="">Select Category</option>
              <option>Smartphones</option>
              <option>Laptops</option>
              <option>Accessories</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="label" class="form-label">Label</label>
            <select class="form-select" id="label">
              <option value="">None</option>
              <option>Hot</option>
              <option>New</option>
              <option>Featured</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="discount" class="form-label">Discount (%)</label>
            <input type="number" class="form-control" id="discount" placeholder="10%">
          </div>
        </div>

        <div class="mb-3">
          <label for="image" class="form-label">Product Image</label>
          <input class="form-control" type="file" id="image">
        </div>

        <button type="submit" class="btn btn-success">Save Product</button>
        <button type="reset" class="btn btn-secondary">Clear</button>
      </form>
    </div>
  </div>

  <!-- Product List Table -->
  <div class="card">
    <div class="card-header bg-primary text-white">Product List</div>
    <div class="card-body table-responsive">
      <table class="table table-bordered table-striped align-middle">
        <thead class="table-primary">
          <tr>
            <th>#</th>
            <th>Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Category</th>
            <th>Label</th>
            <th>Discount</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productTable">
          <!-- Example row -->
          <tr>
            <td>1</td>
            <td><img src="https://via.placeholder.com/60" class="img-thumbnail" alt="Product" /></td>
            <td>Sample Product</td>
            <td>$299.00</td>
            <td>50</td>
            <td>Smartphones</td>
            <td>Hot</td>
            <td>10%</td>
            <td>
              <button class="btn btn-warning btn-sm">Edit</button>
              <button class="btn btn-danger btn-sm">Delete</button>
            </td>
          </tr>
          <!-- Repeat dynamically using JS or JSP -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
